name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Backend install, audit and unit tests
        working-directory: backend
        run: npm install && npm audit --omit=dev --audit-level=high && npm test
      - name: Frontend install, audit and build
        working-directory: frontend
        run: npm install && npm audit --omit=dev --audit-level=high && npm run build
